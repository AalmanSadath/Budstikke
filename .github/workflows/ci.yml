name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by the release workflow, so a tag cannot publish code these checks
  # would have rejected.
  workflow_call:

# Nothing here writes to the repository; the token only reads the checkout.
permissions:
  contents: read

# A newer push makes an older run on the same ref redundant. Called from the
# release workflow this keys on the tag's ref, so a release is never cancelled
# by a branch push.
concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # Pull requests that change nothing but Markdown skip the build. The skip
  # happens here rather than through a `paths-ignore` trigger filter, because
  # a workflow that never starts never reports, and the required check would
  # wait forever. Only pull requests can skip: pushes to main, tags and manual
  # runs always build.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "Not a pull request: full checks."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The whole pull request against where it branched, not only its last
          # commit. --no-renames lists a renamed file under its old path too,
          # so renaming code to .md still counts as a code change.
          files=$(git diff --name-only --no-renames "$BASE...$HEAD")
          echo "Changed files:"
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '\.md$'; then
            echo "Only Markdown changed: the build is skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build, test and lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      # compileSdk 37 and the build tools the local builds use. The runner
      # image may not carry them yet.
      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.1.0"

      # Caches Gradle and checks the wrapper jar against Gradle's published
      # checksums, so a pull request cannot swap in a modified wrapper.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Build, test and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug

      - name: No network permissions
        run: .github/scripts/check-permissions.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports
          path: app/build/reports
          if-no-files-found: ignore

  # The one check the main branch ruleset requires. It passes when the build
  # passed or was skipped for a Markdown-only change, and fails otherwise,
  # including when the change detection itself failed: a failed `changes` job
  # also skips the build, and that skip must not read as a pass.
  passed:
    name: CI passed
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "changes: $CHANGES, build: $BUILD"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Change detection did not succeed"
            exit 1
          fi
          case "$BUILD" in
            success|skipped) echo "CI passed." ;;
            *) echo "::error::The build $BUILD"; exit 1 ;;
          esac
