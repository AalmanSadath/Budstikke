name: Release

# Pushing a tag vX.Y.Z builds, signs and publishes that version. A manual run
# is the dry run: it builds and signs the APK the same way, keeps it as a
# workflow artifact to install and test, and publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The same checks as every pull request, on the commit being released.
  check:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version:
    name: Version agrees
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: check
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gradle=app/build.gradle.kts
          read_name() { sed -nE 's/^ *versionName = "([^"]*)".*/\1/p' "$1"; }
          read_code() { sed -nE 's/^ *versionCode = ([0-9]+).*/\1/p' "$1"; }
          version=$(read_name "$gradle")
          code=$(read_code "$gradle")
          echo "versionName $version, versionCode $code"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::versionName in $gradle is not X.Y.Z (got '$version')"
            exit 1
          fi
          if ! [[ "$code" =~ ^[0-9]+$ ]]; then
            echo "::error::No versionCode found in $gradle"
            exit 1
          fi
          if [ "$REF_TYPE" = "tag" ] && [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match versionName $version in $gradle"
            exit 1
          fi
          # Android refuses an update whose versionCode is not higher than the
          # installed one, so a release that forgot to raise it could never
          # reach anyone who has the previous one.
          if previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null); then
            previous_code=$(git show "$previous:$gradle" | read_code /dev/stdin)
            echo "Previous release $previous had versionCode $previous_code"
            if [ "$code" -le "$previous_code" ]; then
              echo "::error::versionCode $code is not higher than $previous_code in $previous"
              exit 1
            fi
          else
            echo "No earlier release tag: first release."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Signed APK
    needs: [check, version]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.1.0"

      # No cache for the signed build: it is built from the source alone, not
      # from build outputs a pull request run could have saved.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-disabled: true

      # Checked up front, because without the key Gradle still succeeds and
      # produces an unsigned APK nobody can install.
      - name: Write the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret ANDROID_$v is not set"
              exit 1
            fi
          done
          umask 077
          # Whitespace stripped, so a secret pasted with a line break decodes.
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the release APK
        env:
          BUDSTIKKE_KEYSTORE: ${{ runner.temp }}/release.jks
          BUDSTIKKE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUDSTIKKE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BUDSTIKKE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-build-cache assembleRelease

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Name the APK
        run: |
          set -euo pipefail
          src=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$src" ]; then
            echo "::error::No signed APK at $src; the build produced: $(find app/build/outputs/apk -name '*.apk' | tr '\n' ' ')"
            exit 1
          fi
          mkdir -p dist
          mv "$src" "dist/Budstikke-$VERSION.apk"

      # An APK signed by any other key would install once and then refuse
      # every update, so the certificate is compared with the published one.
      - name: Verify the signature
        env:
          EXPECTED: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          expected=$(printf '%s' "$EXPECTED" | tr -d ': \r\n' | tr 'A-F' 'a-f')
          if [ -z "$expected" ]; then
            echo "::error::Repository variable RELEASE_CERT_SHA256 is not set"
            exit 1
          fi
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          certs=$("$tools/apksigner" verify --print-certs "dist/Budstikke-$VERSION.apk")
          echo "$certs" | grep -E 'Signer|SHA-256'
          if ! echo "$certs" | grep -q "certificate SHA-256 digest: $expected"; then
            echo "::error::The APK is not signed with the release certificate ($expected)"
            exit 1
          fi

      - name: No network permissions
        run: .github/scripts/check-permissions.sh "dist/Budstikke-$VERSION.apk"

      - name: Checksum
        working-directory: dist
        run: sha256sum "Budstikke-$VERSION.apk" | tee "Budstikke-$VERSION.apk.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: budstikke-apk
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: [version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: budstikke-apk
          path: dist

      # Signed provenance tying the APK to this workflow run and commit,
      # checkable with `gh attestation verify`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/Budstikke-${{ env.VERSION }}.apk

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          name: Budstikke ${{ env.VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Budstikke-${{ env.VERSION }}.apk
            dist/Budstikke-${{ env.VERSION }}.apk.sha256
